<title id="title">An agent-guided research loop in COMSOL</title><desc id="desc">A research question enters model construction. The agent builds a model, runs a study, inspects the results, and refines the model before another calculation. Interpretable results lead to plots and findings. All physical graphics are illustrative.</desc>
